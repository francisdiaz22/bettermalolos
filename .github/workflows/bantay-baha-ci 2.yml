name: Bantay Baha CI

on:
  push:
    paths:
      - "bantay_baha/**"
      - "bantay_baha_node/**"
      - ".github/workflows/bantay-baha-ci.yml"
  pull_request:
    paths:
      - "bantay_baha/**"
      - "bantay_baha_node/**"
      - ".github/workflows/bantay-baha-ci.yml"

jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bantay_baha_node
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bantay_baha_node/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bantay_baha
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root-test
          MARIADB_USER: bantay
          MARIADB_PASSWORD: bantay
          MARIADB_DATABASE: bantay_baha
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install alembic PyMySQL httpx beautifulsoup4 lxml structlog

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Type check (mypy)
        run: mypy app --ignore-missing-imports

      - name: Migrate
        env:
          DATABASE_URL: mysql+pymysql://bantay:bantay@127.0.0.1:3306/bantay_baha?charset=utf8mb4
        run: alembic upgrade head

      - name: Seed
        env:
          DATABASE_URL: mysql+pymysql://bantay:bantay@127.0.0.1:3306/bantay_baha?charset=utf8mb4
        run: python -m app.jobs.seed_sources

      - name: Unit + integration tests
        env:
          TEST_DATABASE_URL: mysql+pymysql://bantay:bantay@127.0.0.1:3306/bantay_baha?charset=utf8mb4
          STORAGE_BACKEND: database
          OPS_API_TOKEN: ci-token
        run: pytest -v --tb=short

      - name: Collector dry-run with fixture (no network)
        run: python -m app.jobs.collect --fixture tests/fixtures/pdrrmo/sample_2026-09-02.html --once

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t bantay-baha:ci ./bantay_baha
      - name: Smoke — migrations
        run: docker run --rm bantay-baha:ci sh -c "alembic --help"
