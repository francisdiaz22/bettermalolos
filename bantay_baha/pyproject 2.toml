[project]
name = "bantay-baha"
version = "0.1.0"
description = "Bantay Baha — decision-support ingestion and internal ops service (Phase A foundations)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "BetterMalolos" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "PyMySQL>=1.1.1",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  "python-dateutil>=2.9",
  "structlog>=24.4",
  "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.9",
  "mypy>=1.13",
  "types-python-dateutil",
  "types-beautifulsoup4",
  "boto3>=1.35",
]

[project.scripts]
bantay-baha = "app.jobs.collect:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C4", "UP"]
ignore = ["B008", "E501", "F821"]
# B008 is incompatible with FastAPI Depends pattern; E501 relaxed for Phase A; F821 forward refs in models are string-annotated

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.alembic]
script_location = "migrations"
