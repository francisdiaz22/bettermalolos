services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: local-root-only
      MARIADB_USER: bantay
      MARIADB_PASSWORD: bantay
      MARIADB_DATABASE: bantay_baha
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: mysql+pymysql://bantay:bantay@db:3306/bantay_baha?charset=utf8mb4
      STORAGE_BACKEND: database
      APP_ENV: development
      OPS_API_TOKEN: dev-token
      PDRRMO_URL: https://pdrrmo.bulacan.gov.ph/
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m app.jobs.seed_sources && uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload"

  # Example one-off collector job (run via `docker compose run collector`)
  collector:
    build: .
    environment:
      DATABASE_URL: mysql+pymysql://bantay:bantay@db:3306/bantay_baha?charset=utf8mb4
      STORAGE_BACKEND: database
      OPS_API_TOKEN: dev-token
    depends_on:
      db:
        condition: service_healthy
    profiles: ["collector"]
    command: python -m app.jobs.collect --once
    restart: "no"

volumes:
  mariadb_data:
